<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#145f2f" />
  <title>🚩 THE LOSERBOARD 🚩</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stadium">
    <header class="scoreboard">
      <div class="flag left">🚩</div>
      <div class="title-block">
        <h1 class="title">THE LOSERBOARD</h1>
        <p class="subtitle" id="subtitle">warming up the bench…</p>
      </div>
      <div class="flag right">🚩</div>
    </header>

    <nav class="tabs" id="league-tabs" hidden></nav>

    <nav class="toggle" id="toggle" hidden>
      <button class="toggle-btn active" data-view="season">SEASON DAMAGE</button>
      <button class="toggle-btn" data-view="week">LATEST WEEK</button>
    </nav>

    <main id="board" class="board" aria-live="polite">
      <div class="loading">
        <div class="football-spin">🏈</div>
        <p>Reviewing the tape…</p>
      </div>
    </main>

    <footer class="footer">
      <p id="footer-note">data via Sleeper API · fines are for entertainment (and shame)</p>
      <p class="legend">
        <span class="chip ice">🥶 Ice Cold — lowest score, $2</span>
        <span class="chip bench">🪑 Bench Warmer — 2 missed lineups, $5 (×1.25 cascade)</span>
      </p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
